{% extends "base.html" %}
{% import "_ui.html" as ui with context %}
{% block title %}Act as a user{% endblock %}
{% block content %}
<div class="page-head"><h1>Act as a user</h1><p>This demo has no passwords. Pick who you are; the database enforces moderator rules.</p></div>
<form method="post" class="form">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field"><span>User</span>
    <select name="user_id" required style="height:40px;width:100%">
      {% for u in users %}<option value="{{ u.user_id }}">{{ u.username }} · {{ u.site_role }}{% if u.banned_on %} · banned{% endif %}</option>{% endfor %}
    </select>
  </label>
  <div><button class="btn primary">Continue</button></div>
</form>
{% endblock %}
